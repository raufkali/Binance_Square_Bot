jobs:
  trigger-post:
    runs-on: ubuntu-latest

    steps:
      - name: Random pre-trigger delay
        run: |
          # Random delay between 1 and 6 minutes, in seconds.
          # Keeps the visible trigger time off the exact hour mark
          # and different every run, without spending much runner time.
          DELAY=$(( (RANDOM % 300) + 60 ))

          MINUTES=$((DELAY / 60))
          SECONDS=$((DELAY % 60))

          echo "Sleeping ${MINUTES}m ${SECONDS}s before triggering..."

          sleep "$DELAY"

      - name: Trigger Binance Square Bot
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.POST_TRIGGER_SECRET }}" \
            -H "Content-Type: application/json" \
            --data '{}' \
            --fail \
            --show-error \
            --silent \
            --output response.json \
            "https://binance-square-bot-loi6.onrender.com/post"

          echo "Response:"
          cat response.json