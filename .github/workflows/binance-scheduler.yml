name: Binance Square Scheduler

on:
  # Run every 6 hours at:
  # 00:00, 06:00, 12:00, 18:00 UTC
  schedule:
    - cron: "0 */6 * * *"

  # Allow manual testing from GitHub Actions
  workflow_dispatch:

concurrency:
  group: binance-square-scheduler
  cancel-in-progress: false

jobs:
  trigger-binance:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Binance Square Bot
        shell: bash
        env:
          POST_TRIGGER_SECRET: ${{ secrets.POST_TRIGGER_SECRET }}
        run: |
          set -e

          echo "========================================="
          echo "🚀 Triggering Binance Square Bot"
          echo "========================================="
          echo "🕐 Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          if [ -z "$POST_TRIGGER_SECRET" ]; then
            echo "❌ POST_TRIGGER_SECRET is not configured!"
            exit 1
          fi

          echo "📡 Sending request to Render..."

          HTTP_CODE=$(curl \
            --request POST \
            --header "Authorization: Bearer $POST_TRIGGER_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}' \
            --fail-with-body \
            --silent \
            --show-error \
            --output response.json \
            --write-out "%{http_code}" \
            "https://binance-square-bot-loi6.onrender.com/post")

          echo ""
          echo "📡 HTTP Status: $HTTP_CODE"
          echo "📄 Binance response:"
          cat response.json

          echo ""
          echo "========================================="

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Binance Square Bot triggered successfully!"
          else
            echo "❌ Binance Square Bot returned HTTP $HTTP_CODE"
            exit 1
          fi